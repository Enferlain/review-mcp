[project]
name = "review-mcp"
version = "0.1.0"
description = "MCP server for AI-powered code review using GLM-5.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0.0",
    "mcp[cli]>=2.0.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
review-mcp = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "reviewer"]
